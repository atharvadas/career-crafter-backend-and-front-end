<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Career Crafter — Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #F0F2F5;
    min-height: 100vh;
    color: #1a1a2e;
  }

  /* ── NAVBAR ── */
  nav {
    background: #fff;
    border-bottom: 1px solid #E5E7EB;
    padding: 0.85rem 4%;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, #1a6b4a 0%, #2ecc8a 50%, #3aa8d8 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .brand-name { font-size: 1.1rem; font-weight: 700; color: #1a1a2e; }
  .back-link {
    font-size: 0.85rem; color: #6C63FF; text-decoration: none;
    font-weight: 600; display: flex; align-items: center; gap: 0.3rem;
    transition: gap 0.2s;
  }
  .back-link:hover { gap: 0.5rem; }

  /* ── MAIN ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 4% 4rem;
  }

  /* ── SELECT ── */
  .select-label {
    font-size: 0.8rem; font-weight: 600; color: #555;
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 0.5rem; display: block;
  }
  .select-wrap {
    position: relative; display: inline-block; margin-bottom: 1.5rem;
  }
  .select-wrap select {
    appearance: none; -webkit-appearance: none;
    background: #fff; border: 1.5px solid #E5E7EB;
    border-radius: 10px; padding: 0.65rem 2.8rem 0.65rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.93rem; font-weight: 600; color: #1a1a2e;
    cursor: pointer; outline: none;
    transition: border-color 0.2s;
    min-width: 220px;
  }
  .select-wrap select:focus { border-color: #6C63FF; }
  .select-wrap::after {
    content: '▾'; position: absolute; right: 1rem; top: 50%;
    transform: translateY(-50%); color: #888; pointer-events: none;
  }

  /* ── HERO BANNER ── */
  .career-banner {
    border-radius: 16px; padding: 2rem 2.2rem;
    margin-bottom: 1.5rem; color: #fff;
    transition: background 0.4s;
  }
  .career-banner h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .career-banner p { font-size: 0.9rem; opacity: 0.85; margin-bottom: 1rem; }
  .banner-tags { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .banner-tag {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 100px; padding: 0.3rem 0.9rem;
    font-size: 0.78rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.4rem;
  }

  /* ── SECTION CARD ── */
  .section-card {
    background: #fff; border: 1px solid #E5E7EB;
    border-radius: 16px; padding: 1.6rem;
    margin-bottom: 1.2rem;
  }
  .section-card-title {
    font-size: 0.95rem; font-weight: 700; color: #1a1a2e;
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1.2rem;
  }
  .section-card-title .s-icon { font-size: 1rem; }

  /* skills */
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .skill-tag {
    background: #F3F0FF; color: #6C63FF;
    border: 1px solid #DDD6FE;
    border-radius: 100px; padding: 0.28rem 0.8rem;
    font-size: 0.78rem; font-weight: 600;
  }

  /* certifications */
  .cert-list { list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }
  .cert-list li {
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 0.88rem; color: #333;
  }
  .cert-dot { width: 8px; height: 8px; border-radius: 50%; background: #6C63FF; flex-shrink: 0; }

  /* courses */
  .courses-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .course-item {
    display: flex; align-items: center; gap: 0.7rem;
    background: #F9FAFB; border-radius: 10px; padding: 0.65rem 0.9rem;
    font-size: 0.85rem; font-weight: 500; color: #333;
  }
  .course-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: #22c55e; color: #fff;
    font-size: 0.72rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* roadmap steps */
  .roadmap-steps { display: flex; flex-direction: column; gap: 0; }
  .roadmap-step {
    display: flex; gap: 1rem; position: relative;
  }
  .roadmap-step:not(:last-child)::before {
    content: ''; position: absolute;
    left: 17px; top: 36px;
    width: 2px; height: calc(100% - 16px);
    background: #E5E7EB; z-index: 0;
  }
  .step-circle {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem; font-weight: 700; color: #fff;
    flex-shrink: 0; position: relative; z-index: 1;
    margin-top: 0.1rem;
  }
  .step-body {
    flex: 1; background: #FAFAFA; border: 1px solid #F0F0F0;
    border-radius: 12px; padding: 1rem 1.2rem;
    margin-bottom: 0.8rem;
  }
  .step-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.5rem;
  }
  .step-title { font-size: 0.95rem; font-weight: 700; color: #1a1a2e; }
  .step-duration {
    font-size: 0.75rem; font-weight: 600;
    color: #f97316; background: #FFF7ED;
    padding: 0.2rem 0.6rem; border-radius: 100px;
  }
  .step-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .step-chip {
    background: #F3F4F6; color: #555;
    border-radius: 100px; padding: 0.22rem 0.7rem;
    font-size: 0.77rem; font-weight: 500;
  }

  /* salary bar */
  .salary-section { margin-top: 1.2rem; }
  .salary-header { display: flex; justify-content: space-between; margin-bottom: 0.4rem; }
  .salary-label { font-size: 0.82rem; font-weight: 600; color: #555; }
  .salary-value { font-size: 0.82rem; font-weight: 700; color: #22c55e; }
  .salary-bar { height: 6px; background: #E5E7EB; border-radius: 6px; overflow: hidden; }
  .salary-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #22c55e, #16a34a); transition: width 0.6s ease; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .skills-grid { grid-template-columns: 1fr; }
    .courses-grid { grid-template-columns: 1fr; }
    .career-banner h1 { font-size: 1.4rem; }
  }
</style>

          </div>
        `).join('')}
      </div>
    </div>

    <!-- Roadmap -->
    <div class="section-card">
      <div class="section-card-title"><span class="s-icon">🗺️</span> Step-by-Step Roadmap</div>
      <div class="roadmap-steps">
        ${c.steps.map((step,i)=>`
          <div class="roadmap-step">
            <div class="step-circle" style="background:${step.color}">${i+1}</div>
            <div class="step-body">
              <div class="step-header">
                <span class="step-title">${step.title}</span>
                <span class="step-duration">${step.duration}</span>
              </div>
              <div class="step-chips">
                ${step.chips.map(chip=>`<span class="step-chip">${chip}</span>`).join('')}
              </div>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- Salary -->
      <div class="salary-section">
        <div class="salary-header">
          <span class="salary-label">💰 Expected Salary Range (India)</span>
          <span class="salary-value">${c.salary}</span>
        </div>
        <div class="salary-bar">
          <div class="salary-fill" style="width:${c.salaryPct}%"></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('roadmapContent').innerHTML = html;
  try {
    var sel = document.getElementById('careerSelect');
    var v = sel && sel.value;
    if (v) {
      localStorage.setItem('roadmap_career', v);
      var u = new URL(window.location.href);
      u.searchParams.set('career', v);
      history.replaceState({}, '', u);
    }
  } catch (_) {}
}

function applyCareerFromUrlOrStorage() {
  var sel = document.getElementById('careerSelect');
  if (!sel) return;
  var key = null;
  try {
    var params = new URLSearchParams(window.location.search);
    var q = params.get('career');
    if (q && careers[q]) key = q;
    if (!key) {
      var s = localStorage.getItem('roadmap_career');
      if (s && careers[s]) key = s;
    }
  } catch (_) {}
  if (key) sel.value = key;
}

applyCareerFromUrlOrStorage();
renderCareer();
</script>
<script src="chatbot.js"></script>
</body>
</html>
